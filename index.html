    tailwind.config = {
      theme: {
        extend: {}
      }

  <style>
    .aurora {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at bottom, #0f2027, #203a43, #2c5364);
    }

    .aurora::before, .aurora::after {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        from 90deg,
        rgba(0, 255, 255, 0.1),
        rgba(0, 128, 255, 0.25),
        rgba(128, 0, 255, 0.2),
        rgba(0, 255, 128, 0.25),
        rgba(0, 255, 255, 0.1)
      );
      animation: auroraMove 10s linear infinite;
      mix-blend-mode: overlay;
    }

    .aurora::after {
      animation-direction: reverse;
      opacity: 0.6;
    }

    @keyframes auroraMove {
      0% { transform: rotate(0deg) scale(1); }
      100% { transform: rotate(360deg) scale(1.2); }
    }

    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body class="bg-[#0d1117] text-gray-200 font-sans">
  <div id="root"></div>
